name: BTC Altcoin Lag Scanner

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (GitHub may delay a few minutes at busy times)
  workflow_dispatch: {}       # lets you also trigger it manually from the Actions tab

permissions:
  contents: write            # needed so the workflow can commit the updated state.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
        run: python bot.py

      - name: Commit updated state
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update scanner state [skip ci]"
          git push
